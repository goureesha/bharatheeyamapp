allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// ── 16 KB page-size alignment for ALL native (CMake) builds ──
// Required by Google Play for Android 15+ (Nov 2025).
// Injects the linker flag into every subproject that uses externalNativeBuild,
// including Flutter plugins like sweph that compile .so from C source.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                                      "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
                        }
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

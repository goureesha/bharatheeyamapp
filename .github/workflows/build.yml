name: Build AAB & Flutter Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_android:
    name: 🤖 Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/bharatheeyam-release.jks
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=bharatheeyam-release.jks" >> android/key.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Patch sweph for 16KB page alignment
        run: |
          # Find sweph's native CMakeLists.txt in the pub cache and inject 16KB linker flag
          SWEPH_CMAKE=$(find $HOME/.pub-cache -path "*/sweph*/native/CMakeLists.txt" 2>/dev/null | head -1)
          if [ -n "$SWEPH_CMAKE" ]; then
            echo "" >> "$SWEPH_CMAKE"
            echo "# 16KB page-size alignment (Android 15+ requirement)" >> "$SWEPH_CMAKE"
            echo 'target_link_options(sweph PRIVATE "-Wl,-z,max-page-size=16384")' >> "$SWEPH_CMAKE"
            echo "✅ Patched: $SWEPH_CMAKE"
            cat "$SWEPH_CMAKE"
          else
            echo "⚠️ sweph CMakeLists.txt not found - skipping patch"
          fi

      - name: Build AAB (Play Store)
        run: |
          flutter build appbundle --release --verbose 2>&1 | tee build_output.txt || true
          # Check if AAB was produced
          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "::error::DART ERRORS: $(grep -E 'lib/.*\.dart.*Error|Compiler message|Target kernel_snapshot failed' build_output.txt | head -10 | tr '\n' ' ')"
            echo "::error::GRADLE: $(grep -i 'FAILURE' build_output.txt | head -3 | tr '\n' ' ')"
            echo "::error::LAST50: $(tail -50 build_output.txt | tr '\n' '|||')"
            exit 1
          fi

      - name: Upload AAB (For Google Play)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bharatheeyam-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1


  build_web:
    name: 🌐 Build Flutter Web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Web
        run: flutter config --enable-web

      - name: Build Web
        run: |
          flutter build web --release --base-href "/bharatheeyamapp/" 2>&1 | tee web_build.txt || true
          if [ ! -d build/web ]; then
            echo "::error::WEB BUILD ERRORS: $(grep -i -E 'Error:|error:' web_build.txt | head -10 | tr '\n' ' ')"
            tail -50 web_build.txt
            exit 1
          fi

      - name: Copy docs into web build
        run: |
          cp docs/*.html build/web/ || true
          cp docs/*.md build/web/ || true



      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web

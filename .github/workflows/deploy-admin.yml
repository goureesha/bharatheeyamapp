name: Deploy Admin Website to Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $RUNNER_TEMP/sa_key.json

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project bharatheeyam-app
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa_key.json
